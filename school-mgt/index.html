<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="color-scheme" content="light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="Syntax SaaS — Multi-tenant SaaS School Management and Result-Checking Portal prototype." />
  <title>Syntax SaaS — School Management &amp; Result Checking Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Global top navigation / role switcher -->
  <header class="topbar" id="topbar"></header>

  <!-- Root view container -->
  <main id="app" class="app-root" aria-live="polite"></main>

  <!-- Modal + toast portals -->
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>

  <!-- Global page loader -->
  <div id="page-loader" class="page-loader" aria-live="polite" aria-busy="false">
    <div class="page-loader-inner">
      <div class="page-loader-spinner">
        <svg class="spin" viewBox="0 0 50 50" width="48" height="48" aria-hidden="true">
          <circle class="page-loader-track" cx="25" cy="25" r="22" fill="none" stroke-width="4"/>
          <circle class="page-loader-dash" cx="25" cy="25" r="22" fill="none" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="page-loader-text">Loading…</div>
    </div>
  </div>

  <script>
    // Point the frontend at the Syntax SaaS backend. Override as needed.
    window.API_CONFIG = { baseUrl: "https://syntax-sass.onrender.com", authMode: "bearer", useLiveApi: true };
  </script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
